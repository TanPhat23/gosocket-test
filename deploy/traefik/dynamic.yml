http:
  middlewares:
    security-headers:
      headers:
        sslRedirect: false
        hostsProxyHeaders:
          - "X-Forwarded-Host"
        customResponseHeaders:
          X-Content-Type-Options: "nosniff"
          X-Frame-Options: "DENY"
          X-XSS-Protection: "1; mode=block"
          Referrer-Policy: "strict-origin-when-cross-origin"
          Permissions-Policy: "camera=(), microphone=(), geolocation=()"
